name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.12'
      - run: uv sync --all-groups

      # Lint
      - run: uv run ruff check src tests scripts

      # Unit tests
      - run: uv run pytest -v

      # Notebook sync consistency: sources must match committed .ipynb
      - run: uv run python scripts/sync_notebooks.py
      - run: git diff --exit-code -- notebooks/
        name: Check notebook sources are in sync with .ipynb

      # Install kernel for notebook smoke tests
      - run: uv run python -m ipykernel install --user --name robotics-learning --display-name "Python (robotics-learning)"

      # Smoke-test representative notebooks (nbconvert mode)
      - name: Smoke test notebooks
        run: |
          uv run python scripts/check_notebooks.py --nbconvert \
            14_time_parameterization.ipynb \
            25_integrated_project.ipynb
