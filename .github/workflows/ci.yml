name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.12'
      - run: uv sync --all-groups

      # Lint
      - run: uv run ruff check src tests scripts

      # Unit tests
      - run: uv run pytest -v

      # Verify notebook sources can be synced (structural check only)
      - name: Verify notebook sources are valid
        run: |
          uv run python scripts/sync_notebooks.py
          echo "✅ All notebook sources successfully converted to .ipynb"

      # Smoke-test key notebooks (best-effort; kernel env issues are non-fatal)
      - name: Smoke test notebooks
        continue-on-error: true
        timeout-minutes: 10
        env:
          MPLBACKEND: Agg
        run: |
          uv run python -m ipykernel install --user --force \
            --name robotics-learning --display-name "Python (robotics-learning)" || true
          uv run python scripts/check_notebooks.py --nbconvert \
            14_time_parameterization.ipynb \
            25_integrated_project.ipynb \
            || echo "::warning ::Notebook smoke test skipped (CI kernel limitation)"
